
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğretmen paneli · ODES</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    #odes-error {
      display: none;
      margin: 20px;
      padding: 16px;
      background: #fff0f0;
      color: #8b1e1e;
      border: 1px solid #e5aaaa;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px monospace;
    }
  </style>
</head>

<body data-page="teacher" data-roles="teacher" data-title="Öğretmen paneli">

  <noscript>Bu demo için JavaScript gereklidir.</noscript>

  <pre id="odes-error"></pre>

  <script>
    (function () {
      const box = document.getElementById('odes-error');

      window.odesShowError = function (message) {
        box.style.display = 'block';
        box.textContent += message + '\n\n';
      };

      window.addEventListener('error', function (event) {
        if (event.target && (event.target.src || event.target.href)) {
          window.odesShowError(
            'DOSYA YÜKLENEMEDİ:\n' +
            (event.target.src || event.target.href)
          );
          return;
        }

        window.odesShowError(
          'JAVASCRIPT HATASI:\n' +
          (event.message || 'Bilinmeyen hata') +
          '\nDosya: ' + (event.filename || 'Bilinmiyor') +
          '\nSatır: ' + (event.lineno || 'Bilinmiyor')
        );
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        window.odesShowError(
          'İŞLENMEYEN HATA:\n' + String(event.reason)
        );
      });
    })();
  </script>

  <script src="data.js"
    onerror="odesShowError('data.js yüklenemedi')"></script>

  <script src="app.js"
    onerror="odesShowError('app.js yüklenemedi')"></script>

  <script src="teacher.js"
    onerror="odesShowError('teacher.js yüklenemedi')"></script>

</body>
</html>
